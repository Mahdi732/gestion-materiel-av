<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catalogue de matériel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50">

  <nav id="nav" class="bg-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-600">Matériel</h1>
      <ul class="hidden md:flex space-x-6 text-gray-700">
        <li><a href="client.html" class="hover:text-blue-600">profile</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-8">

    <header class="mb-8 flex flex-col md:flex-row justify-between items-center">
      <div class="text-center md:text-left mb-4 md:mb-0">
        <h1 class="text-3xl font-bold text-gray-800">Catalogue de matériel</h1>
        <p class="text-gray-600">Trouvez le matériel dont vous avez besoin</p>
      </div>
      <button id="toggle-form-btn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 flex items-center">
        <i class="fas fa-plus mr-2"></i> Ajouter un matériel
      </button>
    </header>

    <div class="bg-white p-6 rounded-lg shadow-md mb-8">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Filtrer les résultats</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Category -->
        <div>
          <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Catégorie</label>
          <select id="category" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="" hidden>Toutes les catégories</option>
            <option value="informatique">Informatique</option>
          </select>
        </div>

        <!-- Status -->
        <div>
          <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Statut</label>
          <select id="status" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="" hidden>Tous les statuts</option>
            <option value="disponible">Disponible</option>
            <option value="reserve">Réservé</option>
            <option value="en-maintenance">En maintenance</option>
          </select>
        </div>

        <!-- Search -->
        <div>
          <label for="search" class="block text-sm font-medium text-gray-700 mb-1">Recherche</label>
          <div class="relative">
            <input type="text" id="search" placeholder="Nom, référence..." class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <button class="absolute right-2 top-2 text-gray-500 hover:text-gray-700">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md">
      <div id="catalogue-section" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      </div>

      <div id="no-data-message" class="hidden mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-md text-yellow-800 shadow-sm text-center">
        <h3 class="text-lg font-semibold">No data at the moment</h3>
        <p class="text-sm mt-1">Please wait or try again later.</p>
      </div>
    </div>
  </div>

  <!-- Popup Form Overlay -->
  <div id="form-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b p-4">
        <h3 class="text-xl font-semibold text-gray-800">Ajouter un matériel</h3>
        <button id="close-form-btn" class="text-gray-500 hover:text-gray-700">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <form id="form-catalogue" class="space-y-4 p-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
          <input type="text" id="nom" class="w-full border p-2 rounded" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Marque</label>
          <input type="text" id="marque" class="w-full border p-2 rounded" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Modèle</label>
          <input type="text" id="modele" class="w-full border p-2 rounded" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
          <select id="type_id" class="w-full border p-2 rounded">
            <option value="" hidden>Choisir un type</option>
            <option value="1">Informatique</option>
            <option value="2">Audiovisuel</option>
            <option value="3">test</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">État</label>
          <select  id="etat_id" class="w-full border p-2 rounded">
            <option value="" hidden>Choisir un état</option>
            <option value="1">Disponible</option>
            <option value="2">En maintenance</option>
            <option value="3">test</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Disponible</label>
          <select id="disponible" name="disponible" class="w-full border p-2 rounded">
            <option value="true">Oui</option>
            <option value="false">Non</option>
          </select>
        </div>

        <div>
          <label  class="block text-sm font-medium text-gray-700 mb-1">Caractéristiques</label>
          <input type="text" id="caracteristiques" class="w-full border p-2 rounded" />
        </div>

        <div class="flex justify-end space-x-3 pt-4">
          <button type="button" id="cancel-form-btn" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">
            Annuler
          </button>
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('toggle-form-btn').addEventListener('click', function() {
      document.getElementById('form-overlay').classList.remove('hidden');
    });
    document.getElementById('close-form-btn').addEventListener('click', function() {
      document.getElementById('form-overlay').classList.add('hidden');
    });

    document.getElementById('cancel-form-btn').addEventListener('click', function() {
      document.getElementById('form-overlay').classList.add('hidden');
    });
    document.getElementById('form-overlay').addEventListener('click', function(e) {
      if (e.target === this) {
        this.classList.add('hidden');
      }
    });
  </script>

  <script src="js/catalogue.js"></script>
</body>
</html>
